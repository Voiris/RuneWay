[workspace]
members = [
    "compiler/runec",
    "compiler/runec_utils",
    "compiler/runec_errors",
    "compiler/runec_parse",
    "compiler/runec_source",
    "compiler/runec_ast",
    "compiler/runec_test_utils",
    "compiler/runec_hir",
    "compiler/runec_abi",
    "compiler/runec_builtins",
    "compiler/runec_runtime",
    "compiler/runec_semantic",
    "compiler/runec_mir",
    "compiler/runec_codegen_cranelift",
    "compiler/runec_proc_macro_utils",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Voiris/RuneWay"
homepage = "https://github.com/Voiris/RuneWay"
readme = "README.md"

[workspace.dependencies]
cranelift-codegen = "0"
cranelift-frontend = "0"
cranelift-jit = "0"
cranelift-module = "0"
cranelift-native = "0"
cranelift-object = "0"
indexmap = "2"
memmap2 = "0"
once_cell = "1"
quote = "1"
regex = "1"
syn = { version = "3", features = ["full"] }
runec_abi = { path = "compiler/runec_abi" }
runec_ast = { path = "compiler/runec_ast" }
runec_builtins = { path = "compiler/runec_builtins" }
runec_errors = { path = "compiler/runec_errors" }
runec_hir = { path = "compiler/runec_hir" }
runec_mir = { path = "compiler/runec_mir" }
runec_runtime = { path = "compiler/runec_runtime" }
runec_semantic = { path = "compiler/runec_semantic" }
runec_source = { path = "compiler/runec_source" }
runec_test_utils = { path = "compiler/runec_test_utils" }
runec_utils = { path = "compiler/runec_utils" }
